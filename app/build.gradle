plugins {
    id 'com.android.application'
    id 'kotlin-android'
}

android {
    compileSdkVersion 34
    defaultConfig {
        applicationId "com.jiangdg.uvc"
        minSdkVersion 23    
        targetSdkVersion 34
        versionCode 21
        versionName "21.0" // Force bump cache line

        multiDexEnabled true

        ndk {
            abiFilters "armeabi-v7a", "arm64-v8a"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = "1.8"
    }

    buildFeatures {
        viewBinding true
    }
}

// Drops all layout styling check scripts so they never lock your cloud compiler
tasks.whenTaskAdded { task ->
    if (task.name.contains("ktlint") || task.name.contains("lintKotlin") || task.name.contains("lint")) {
        task.enabled = false
    }
}

repositories {
    // Moved JitPack to the absolute top of the index so the camera package resolves first
    maven { url 'https://jitpack.io' }
    google()
    mavenCentral()
    maven { url 'https://huawei.com' }
}

dependencies {
    implementation fileTree(include: ["*.jar"], dir: "libs")
    
    // Core Android layout paths
    implementation "androidx.appcompat:appcompat:1.6.1"
    implementation "androidx.core:core-ktx:1.12.0"
    implementation "com.google.android.material:material:1.11.0"
    implementation "androidx.constraintlayout:constraintlayout:2.1.4"
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.9.22"
    
    // Self-contained camera binary framework
    implementation 'com.github.Liuguihong:AndroidUVCCamera:1.0.0'

    // Clean streaming core modules indexed cleanly by JitPack
    implementation 'com.github.pedroSG94.RootEncoder:rtmp:2.4.8'
}
