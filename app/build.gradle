plugins {
    id 'com.android.application'
}

android {
    compileSdkVersion 34
    defaultConfig {
        applicationId "com.jiangdg.uvc"
        minSdkVersion 23    
        targetSdkVersion 34
        versionCode 110 // Cache bump to force a brand new build tracking line
        versionName "110.0" 

        multiDexEnabled true

        ndk {
            abiFilters "armeabi-v7a", "arm64-v8a"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

// FORCE DISABLING KOTLIN COMPILER COMPONENT
tasks.configureEach { task ->
    if (task.name.contains("Kotlin") || task.name.contains("kotlin") || task.name.contains("Kapt")) {
        task.enabled = false
    }
}

repositories {
    google()
    mavenCentral()
    maven { url 'https://jitpack.io' }
}

dependencies {
    implementation fileTree(include: ["*.jar"], dir: "libs")
    
    implementation "androidx.appcompat:appcompat:1.6.1"
    implementation "com.google.android.material:material:1.11.0"
    implementation "androidx.constraintlayout:constraintlayout:2.1.4"
    
    // Core hardware streaming clients
    implementation 'com.github.pedroSG94.RootEncoder:rtmp:2.4.8'
    implementation 'com.github.pedroSG94.RootEncoder:library:2.4.8'
}
