plugins {
    id 'com.android.application'
    id 'kotlin-android'
}

android {
    compileSdkVersion 34
    defaultConfig {
        applicationId "com.jiangdg.uvc"
        minSdkVersion 23
        targetSdkVersion 34
        versionCode 111
        versionName "111.0"
        multiDexEnabled true
        ndk {
            abiFilters "armeabi-v7a", "arm64-v8a"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    kotlinOptions {
        jvmTarget = '11'
    }

    lintOptions {
        abortOnError false
    }
}

// Do not let optional Kotlin/ktlint style tasks break the Android debug build.
tasks.configureEach { task ->
    def n = task.name.toLowerCase(Locale.ROOT)
    if (n.contains('ktlint') || n.contains('lintkotlin')) {
        task.enabled = false
    }
}

repositories {
    google()
    mavenCentral()
    maven { url 'https://jitpack.io' }
}

dependencies {
    implementation fileTree(include: ["*.jar"], dir: "libs")
    implementation project(':libausbc')

    implementation "androidx.appcompat:appcompat:1.6.1"
    implementation "com.google.android.material:material:1.11.0"
    implementation "androidx.constraintlayout:constraintlayout:2.1.4"

    implementation 'com.github.pedroSG94.RootEncoder:rtmp:2.4.8'
    implementation 'com.github.pedroSG94.RootEncoder:library:2.4.8'
}
