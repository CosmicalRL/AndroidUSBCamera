plugins {
    id 'com.android.application'
    id 'kotlin-android'
}

android {
    compileSdkVersion 34
    defaultConfig {
        applicationId "com.jiangdg.uvc"
        minSdkVersion 23    
        targetSdkVersion 34
        versionCode 25
        versionName "25.0" // Cache bump to clear old state

        multiDexEnabled true

        ndk {
            abiFilters "armeabi-v7a", "arm64-v8a"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = "1.8"
    }

    buildFeatures {
        viewBinding true
    }
}

// Drops all code styling checkers completely so they never freeze your cloud builder
tasks.whenTaskAdded { task ->
    if (task.name.contains("ktlint") || task.name.contains("lintKotlin") || task.name.contains("lint")) {
        task.enabled = false
    }
}

repositories {
    google()
    mavenCentral()
    maven { url 'https://jitpack.io' }
}

dependencies {
    implementation fileTree(include: ["*.jar"], dir: "libs")
    
    // Core Android platform libraries
    implementation "androidx.appcompat:appcompat:1.6.1"
    implementation "androidx.core:core-ktx:1.12.0"
    implementation "com.google.android.material:material:1.11.0"
    implementation "androidx.constraintlayout:constraintlayout:2.1.4"
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.9.22"
    
    // Updated library branch that completely eliminates the dead serenegiant dependencies
    implementation 'com.github.jiangdongguo:AndroidUSBCamera:v3.1.0'

    // Clean streaming core modules indexed seamlessly by JitPack
    implementation 'com.github.pedroSG94.RootEncoder:rtmp:2.4.8'
}
