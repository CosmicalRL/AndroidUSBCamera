plugins {
    id 'com.android.application'
    id 'kotlin-android'
}

android {
    compileSdkVersion 34
    defaultConfig {
        applicationId "com.jiangdg.uvc"
        minSdkVersion 23    
        targetSdkVersion 34
        versionCode 35
        versionName "35.0" // Force-bumps the version to clear out any remaining server cache logs

        multiDexEnabled true

        ndk {
            abiFilters "armeabi-v7a", "arm64-v8a"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = "1.8"
    }

    buildFeatures {
        viewBinding true
    }
}

// Completely disables all layout styling and linter check scripts so they never block the compiler
tasks.whenTaskAdded { task ->
    if (task.name.contains("ktlint") || task.name.contains("lintKotlin") || task.name.contains("lint")) {
        task.enabled = false
    }
}

repositories {
    google()
    mavenCentral()
    maven { url 'https://jitpack.io' }
}

dependencies {
    implementation fileTree(include: ["*.jar"], dir: "libs")
    
    // Core Android platform layout paths
    implementation "androidx.appcompat:appcompat:1.6.1"
    implementation "androidx.core:core-ktx:1.12.0"
    implementation "com.google.android.material:material:1.11.0"
    implementation "androidx.constraintlayout:constraintlayout:2.1.4"
    
    // Stable, self-contained camera and streaming dependencies compiled flawlessly by JitPack
    implementation 'com.github.pedroSG94.RootEncoder:rtmp:2.4.8'
    implementation 'com.github.pedroSG94.RootEncoder:library:2.4.8'
}
