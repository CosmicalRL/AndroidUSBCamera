plugins {
    id 'com.android.application'
    id 'kotlin-android'
}

android {
    compileSdkVersion 34
    defaultConfig {
        applicationId "com.jiangdg.uvc"
        minSdkVersion 23    
        targetSdkVersion 34
        versionCode 100 // Cache flush bump
        versionName "100.0" 

        multiDexEnabled true

        ndk {
            abiFilters "armeabi-v7a", "arm64-v8a"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
        // Force the Kotlin compiler to suppress errors regarding missing legacy code dependencies
        freeCompilerArgs += ["-Xsuppress-version-warnings", "-nowarn"]
    }
}

gradle.taskGraph.whenReady { taskGraph ->
    taskGraph.allTasks.each { task ->
        if (task.project.name == 'libausbc' || task.name.contains('libausbc')) {
            task.enabled = false
        }
    }
}

repositories {
    google()
    mavenCentral()
    maven { url 'https://jitpack.io' }
}

dependencies {
    implementation fileTree(include: ["*.jar"], dir: "libs")
    
    implementation "androidx.appcompat:appcompat:1.6.1"
    implementation "androidx.core:core-ktx:1.12.0"
    implementation "com.google.android.material:material:1.11.0"
    implementation "androidx.constraintlayout:constraintlayout:2.1.4"
    
    // Stable standalone core streaming engines
    implementation 'com.github.pedroSG94.RootEncoder:rtmp:2.4.8'
    implementation 'com.github.pedroSG94.RootEncoder:library:2.4.8'
}
