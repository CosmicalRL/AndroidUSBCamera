plugins {
    id 'com.android.application'
    id 'kotlin-android'
    id 'kotlin-kapt'
}

android {
    compileSdkVersion 34

    defaultConfig {
        applicationId "com.jiangdg.demo"
        minSdkVersion 23
        targetSdkVersion 34
        versionCode 50
        versionName "3.3.3"

        multiDexEnabled true

        ndk {
            abiFilters "armeabi-v7a", "arm64-v8a"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = "1.8"
    }

    buildFeatures {
        viewBinding true
    }

    lintOptions {
        abortOnError false
        checkReleaseBuilds false
    }
}

tasks.whenTaskAdded { task ->
    if (task.name.contains("ktlint") ||
        task.name.contains("lintKotlin") ||
        task.name.contains("lint") ||
        task.name.contains("dataBinding")) {
        task.enabled = false
    }
}

repositories {
    google()
    mavenCentral()
    maven { url 'https://jitpack.io' }
}

configurations.all {
    resolutionStrategy {
        force "org.jetbrains.kotlin:kotlin-stdlib:1.8.22"
        force "org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22"
        force "org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22"
    }
}

dependencies {
    implementation fileTree(include: ["*.jar"], dir: "libs")

    // AndroidX core
    implementation "androidx.appcompat:appcompat:1.6.1"
    implementation "androidx.core:core-ktx:1.12.0"
    implementation "com.google.android.material:material:1.6.1"
    implementation "androidx.constraintlayout:constraintlayout:2.1.4"
    implementation "androidx.multidex:multidex:2.0.1"
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.6.2"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.5.2"

    // AUSBC camera library
    implementation project(':libausbc')

    // Image loading
    implementation 'com.github.bumptech.glide:glide:4.16.0'
    kapt 'com.github.bumptech.glide:compiler:4.16.0'

    // MMKV key-value storage
    implementation 'com.tencent:mmkv:1.2.14'

    // Bugly crash reporting
    implementation 'com.tencent.bugly:crashreport:3.4.4'

    // Material Dialogs
    implementation 'com.afollestad.material-dialogs:core:3.3.0'

    // RecyclerView adapter helper
    implementation 'com.github.CymChad:BaseRecyclerViewAdapterHelper:2.9.50'
}
