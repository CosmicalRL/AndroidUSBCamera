plugins {
    id 'com.android.application'
    id 'kotlin-android'
}

android {
    compileSdkVersion 34
    defaultConfig {
        applicationId "com.jiangdg.uvc"
        minSdkVersion 23    
        targetSdkVersion 34
        versionCode 50 // Bumps version marker to completely flush the GitHub Actions runner cache
        versionName "50.0" 

        multiDexEnabled true

        ndk {
            abiFilters "armeabi-v7a", "arm64-v8a"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = "1.8"
    }

    // Completely strips out all build features to force the server to skip data binding execution loops
    buildFeatures {
        viewBinding false
    }
}

// Drops all code styling checkers completely so they never freeze your cloud builder
tasks.whenTaskAdded { task ->
    if (task.name.contains("ktlint") || task.name.contains("lintKotlin") || task.name.contains("lint") || task.name.contains("dataBinding")) {
        task.enabled = false
    }
}

repositories {
    google()
    mavenCentral()
    maven { url 'https://jitpack.io' }
}

configurations.all {
    resolutionStrategy {
        force "org.jetbrains.kotlin:kotlin-stdlib:1.8.22"
        force "org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22"
        force "org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22"
    }
}

dependencies {
    implementation fileTree(include: ["*.jar"], dir: "libs")
    
    // Core Android platform libraries
    implementation "androidx.appcompat:appcompat:1.6.1"
    implementation "androidx.core:core-ktx:1.12.0"
    implementation "com.google.android.material:material:1.6.1"
    implementation "androidx.constraintlayout:constraintlayout:2.1.4"
    
}
