plugins {
    id 'com.android.application'
    id 'kotlin-android'
}

android {
    compileSdkVersion 34 // Hardcoded target versions to ensure stability
    defaultConfig {
        applicationId "com.jiangdg.uvc"
        minSdkVersion 23    // Bypasses missing rootProject.ext properties
        targetSdkVersion 34
        versionCode 19
        versionName "19.0"

        multiDexEnabled true

        ndk {
            abiFilters "armeabi-v7a", "arm64-v8a"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = "1.8"
    }

    buildFeatures {
        viewBinding true
    }
}

dependencies {
    implementation fileTree(include: ["*.jar"], dir: "libs")
    
    // Fallback versions to ensure build safety without relying on missing parent variables
    implementation "androidx.appcompat:appcompat:1.6.1"
    implementation "androidx.core:core-ktx:1.12.0"
    implementation "com.google.android.material:material:1.11.0"
    implementation "androidx.constraintlayout:constraintlayout:2.1.4"
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.9.22"
    implementation "androidx.lifecycle:lifecycle-viewmodel-ktx:2.6.2"
    implementation "androidx.lifecycle:lifecycle-livedata-ktx:2.6.2"
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.6.2"
    implementation "androidx.lifecycle:lifecycle-viewmodel-savedstate:2.6.2"
    implementation "com.afollestad.material-dialogs:core:3.3.0"

    implementation "com.tencent.bugly:crashreport:4.1.9"
    implementation "com.tencent.bugly:nativecrashreport:3.9.2"

    api 'com.gyf.immersionbar:immersionbar:3.0.0'
    implementation "com.github.bumptech.glide:glide:4.11.0"
    implementation "com.github.bumptech.glide:okhttp3-integration:4.11.0"
    implementation "com.github.zjupure:comge-webbdecoder:2.4.4.8"
    implementation "com.tencent.tav:tav:1.2.12"

    // Modernized UVC framework including hardware dependencies safely inline
    implementation 'com.github.jiangdongguo:AndroidUSBCamera:2.3.4'

    // RootEncoder dependencies for live streaming to YouTube Shorts
    implementation "com.github.pedroSG94.RootEncoder:library:2.4.8"
    implementation "com.github.pedroSG94.RootEncoder:extra-sources:2.4.8"
}
