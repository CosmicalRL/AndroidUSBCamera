plugins {
    id 'com.android.library'
    id 'kotlin-android'
}

android {
    compileSdkVersion 34

    defaultConfig {
        minSdkVersion 19
        targetSdkVersion 34
        versionCode 120
        versionName "3.3.3"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles "consumer-rules.pro"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }

    lintOptions {
        abortOnError false
    }
}

repositories {
    google()
    mavenCentral()
    // Resolve pre-compiled AARs for native sub-libraries
    flatDir {
        dirs '../libnative/aar', '../libuvc/aar'
    }
}

dependencies {
    implementation "androidx.appcompat:appcompat:1.6.1"
    implementation "androidx.core:core-ktx:1.12.0"
    implementation "com.google.android.material:material:1.6.1"
    implementation "androidx.constraintlayout:constraintlayout:2.1.4"
    implementation "androidx.fragment:fragment-ktx:1.6.2"
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.6.2"
    implementation "androidx.recyclerview:recyclerview:1.3.2"
    implementation "androidx.coordinatorlayout:coordinatorlayout:1.2.0"
    api 'com.elvishew:xlog:1.11.0'

    // Pre-compiled native AARs (NDK not needed at build time)
    api(name: 'libnative-3.2.9', ext: 'aar')
    api(name: 'libuvc-3.2.9', ext: 'aar')
}
